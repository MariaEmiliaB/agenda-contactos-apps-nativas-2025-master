<li [class.favourite]="contact().isFavorite === true">
    <span>{{contact().firstName}} {{contact().lastName}}</span>
    <span>{{contact().number}}</span>
    <span>{{contact().email}}</span>
    <span>-</span>
    <span><button (click)= "openDeleteModal()" class="boton-borrar">Borrar</button></span>
    <a routerLink="contacts/:idContacto/edit" class="boton-editar">Editar</a>
    <span>
        @if (contact().isFavorite === true) {
            ⭐
        }
    </span>
</li>
